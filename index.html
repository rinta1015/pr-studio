<style>
/* Layout: prompter under the camera, preview + settings below, takes last. Looks like a phone camera app: black, grey fills, red record. */
:root{
  --bg:#000; --panel:#1c1c1e; --fill:#2c2c2e; --sel:#5a5a5e; --sep:#38383a;
  --fg:#f2f2f7; --muted:#8e8e93; --cue:#ffd60a; --rec:#ff3b30; --ok:#30d158;
  --f-ui:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  --f-read:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 32px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.num{font-variant-numeric:tabular-nums}

/* Prompter */
.prompter{position:relative;height:clamp(220px,40vh,420px);background:#000;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px #1f1f21}
.track{position:absolute;left:0;right:0;top:0;padding:0 clamp(16px,5vw,64px);will-change:transform}
.track p{margin:0;margin-block-end:.7em;font-family:var(--f-read);font-size:var(--fs,40px);line-height:1.55;font-weight:700;color:#fff;letter-spacing:.02em}
.track p.ph{color:#48484a;font-size:min(var(--fs,40px),28px)}
.guide{position:absolute;left:0;right:0;top:var(--gy,28%);height:0;border-top:1px solid rgba(255,214,10,.28);pointer-events:none}
.guide::before,.guide::after{content:"";position:absolute;top:-6px;border:5px solid transparent}
.guide::before{left:0;border-left-color:var(--cue)}
.guide::after{right:0;border-right-color:var(--cue)}
.fade{position:absolute;left:0;right:0;pointer-events:none}
.fade.top{top:0;height:14%;background:linear-gradient(#000,transparent)}
.fade.bot{bottom:0;height:30%;background:linear-gradient(transparent,#000)}
.prompter.v{height:clamp(360px,62vh,760px)}
.prompter.v .track{left:50%;right:auto;padding:0;writing-mode:vertical-rl}
.prompter.v .track p{margin:0;white-space:nowrap;line-height:1.2;letter-spacing:.08em}
.tcy{text-combine-upright:all;-webkit-text-combine:horizontal}
.brk{display:inline-block;inline-size:2em;text-align:center;color:var(--cue)}
.prompter.v .guide{display:none}
.win{display:none;position:absolute;left:50%;top:var(--wy,24px);transform:translateX(-50%);width:calc(var(--fs) * 1.9);height:var(--wh,160px);border:2px solid var(--cue);border-radius:12px;pointer-events:none}
.prompter.v .win{display:block}
.prompter[data-cam="left"]:not(.v) .track{padding-left:clamp(12px,3vw,32px);padding-right:40%}
.prompter[data-cam="right"]:not(.v) .track{padding-right:clamp(12px,3vw,32px);padding-left:40%}
.prompter[data-cam="left"]:not(.v) .guide{right:38%}
.prompter[data-cam="right"]:not(.v) .guide{left:38%}
.prompter.v[data-cam="left"] .track,.prompter.v[data-cam="left"] .win{left:16%}
.prompter.v[data-cam="right"] .track,.prompter.v[data-cam="right"] .win{left:84%}
.camdot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--cue);pointer-events:none;z-index:2}
.prompter[data-cam="top"] .camdot{top:8px;left:50%;transform:translateX(-50%)}
.prompter[data-cam="left"] .camdot{left:8px;top:var(--gy,40%);transform:translateY(-50%)}
.prompter[data-cam="right"] .camdot{right:8px;top:var(--gy,40%);transform:translateY(-50%)}
.prompter.v[data-cam="left"] .camdot,.prompter.v[data-cam="right"] .camdot{top:calc(var(--wy,24px) + var(--wh,160px) / 2)}
.prompter.v .fade.top{top:0;height:var(--wy,24px);background:rgba(0,0,0,.9)}
.prompter.v .fade.bot{top:calc(var(--wy,24px) + var(--wh,160px));bottom:0;height:auto;background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.92))}
.count{position:absolute;inset:0;display:grid;place-items:center;font-size:min(26vh,150px);font-weight:300;color:#fff;background:rgba(0,0,0,.55);font-variant-numeric:tabular-nums}

/* Segmented control, iOS style */
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;width:max-content;max-width:100%}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 14px;min-height:34px;font-weight:500;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--sel)}
.seg button:hover:not(:disabled){background:#3a3a3c}
.seg button[aria-pressed="true"]:hover:not(:disabled){background:var(--sel)}

/* Studio row */
.studio{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px}
.cam{position:relative;aspect-ratio:16/9;max-width:100%;background:#111;border-radius:14px;overflow:hidden}
.cam.port{aspect-ratio:9/16;justify-self:center;width:min(100%,calc(56vh * 9 / 16))}
@media (max-width:760px),(orientation:portrait) and (max-width:1100px){.studio{grid-template-columns:1fr}.cam{justify-self:center;width:min(100%,calc(30vh * 16 / 9))}.cam.port{width:min(100%,calc(38vh * 9 / 16))}}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.cam .off{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;color:var(--muted);font-size:14px}
.badge{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:var(--rec);color:#fff;padding:2px 10px;border-radius:6px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}

.ctrl{background:var(--panel);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.timer{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.timer .t{font-size:44px;line-height:1;font-weight:300;letter-spacing:.01em}
.timer .of{color:var(--muted);font-size:17px}
.timer.warn .t{color:var(--cue)} .timer.over .t{color:var(--rec)}
.bar{height:3px;background:var(--fill);border-radius:2px;overflow:hidden;margin-top:-6px}
.bar span{display:block;height:100%;width:0;background:var(--fg)}
.timer.warn+.bar span{background:var(--cue)} .timer.over+.bar span{background:var(--rec)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-weight:600;min-height:44px;touch-action:manipulation;border:0;background:var(--fill);color:var(--fg);padding:10px 18px;border-radius:10px;cursor:pointer}
button:hover:not(:disabled){background:#3a3a3c}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #0a84ff;outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
button.rec{background:var(--rec);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.rec:hover:not(:disabled){background:#e0342a}
button.rec::before{content:"";width:12px;height:12px;border-radius:50%;background:#fff}
button.rec.stop::before{border-radius:2px}

.rows{display:flex;flex-direction:column;border-top:1px solid var(--sep)}
.field{display:grid;grid-template-columns:6.5em 1fr auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--sep);min-height:52px}
.field>label,.field>.lab{color:var(--fg)}
.field output,.field .unit{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;min-width:2.5em}
.field .seg{justify-self:start}
.stepper{display:flex;align-items:center;gap:6px;min-width:0}
.stepper input{width:4.6em;min-width:0;min-height:38px;text-align:center;font:500 17px var(--f-ui);font-variant-numeric:tabular-nums;background:var(--fill);color:var(--fg);border:0;border-radius:8px}
.stepper button{min-width:38px;min-height:38px;padding:0 8px;font-size:20px;font-weight:400;line-height:1}
input[type=range]{width:100%;height:32px;accent-color:#f2f2f7;touch-action:pan-y}
.note{font-size:13px;color:var(--muted)}
.note.fast{color:var(--cue)}
.keys{font-size:12px;color:#636366}
.keys kbd{font:inherit;background:var(--fill);border-radius:4px;padding:0 5px;color:var(--muted)}
@media (max-width:760px){
  .mainbtns{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:1.6fr 1.1fr 1fr;gap:8px;background:rgba(28,28,30,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
  .mainbtns button{min-height:56px;font-size:17px;padding:8px 6px;white-space:nowrap}
  body{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  .keys{display:none}
  .prompter.v{height:clamp(300px,46vh,520px)}
  .field{grid-template-columns:5em 1fr auto}
  .seg button{min-height:40px;padding:6px 12px}
}

details{background:var(--panel);border-radius:14px}
summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"›";color:var(--muted);font-size:20px;line-height:1;transition:transform .15s}
details[open] summary::after{transform:rotate(90deg)}
.edit{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
textarea{width:100%;min-height:200px;resize:vertical;background:#000;color:var(--fg);border:0;border-radius:10px;padding:12px;font:16px/1.7 var(--f-read)}
.editfoot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
button.plain{background:transparent;color:#ff453a;padding:8px 4px;min-height:36px}

.takes{display:flex;flex-direction:column;gap:6px}
.takes h2{font-size:13px;font-weight:600;color:var(--muted);margin:8px 0 0 4px}
#takeList{background:var(--panel);border-radius:14px;overflow:hidden}
.take{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:14px;padding:12px;align-items:center;border-bottom:1px solid var(--sep)}
.take:last-child{border-bottom:0}
@media (max-width:560px){.take{grid-template-columns:1fr}}
.take video{width:100%;border-radius:8px;background:#000;display:block}
.take .info{display:flex;flex-direction:column;gap:6px;min-width:0}
.take .name{font-weight:600}
.take .dur{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.take .dur.over{color:var(--rec)}
.take a.save{display:inline-block;text-decoration:none;font-weight:600;color:#0a84ff;padding:6px 0;width:max-content}
.empty{color:var(--muted);font-size:14px;padding:14px 16px}
@media (prefers-reduced-motion:reduce){summary::after{transition:none}}
.foot{font-size:12px;color:#636366;text-align:center;padding:8px 0 4px}
.foot a{color:#8e8e93}
</style>

<div class="wrap">
  <div class="prompter" id="prompter" data-cam="top">
    <div class="track" id="track"></div>
    <div class="fade top"></div><div class="fade bot"></div>
    <div class="guide"></div>
    <div class="camdot" aria-hidden="true"></div>
    <div class="win" id="win"></div>
    <div class="count" id="count" hidden>3</div>
  </div>

  <div class="studio">
    <div class="cam" id="cam">
      <video id="preview" autoplay muted playsinline></video>
      <div class="off" id="camOff">カメラを起動中</div>
      <div class="badge" id="recBadge" hidden><span id="badgeT">0:00</span></div>
    </div>

    <div class="ctrl">
      <div class="timer" id="timer"><span class="t" id="tNow">0:00.0</span><span class="of">/ <span id="tLimit">1:00</span></span></div>
      <div class="bar"><span id="barFill"></span></div>
      <div class="btns mainbtns">
        <button class="rec" id="btnRec" disabled>録画</button>
        <button id="btnPractice">練習</button>
        <button id="btnReset">最初へ</button>
      </div>
      <div class="rows">
        <div class="field"><span class="lab">原稿</span><div class="seg" role="group" aria-label="原稿の向き"><button id="btnH" aria-pressed="true">横書き</button><button id="btnV" aria-pressed="false">縦書き</button></div><span></span></div>
        <div class="field"><span class="lab">動画</span><div class="seg" role="group" aria-label="動画の向き"><button id="btnOH" aria-pressed="true">横 16:9</button><button id="btnOV" aria-pressed="false">縦 9:16</button></div><span></span></div>
        <div class="field"><span class="lab">カメラ</span><div class="seg" role="group" aria-label="カメラの位置"><button class="camsel" data-cam="top" aria-pressed="true">上</button><button class="camsel" data-cam="left" aria-pressed="false">左</button><button class="camsel" data-cam="right" aria-pressed="false">右</button></div><span></span></div>
        <div class="field"><label for="numLimit">制限時間</label><div class="stepper"><button type="button" class="step" data-for="numLimit" data-d="-5" aria-label="5秒減らす">−</button><input type="number" id="numLimit" inputmode="numeric" min="5" max="600" step="1" value="60"><button type="button" class="step" data-for="numLimit" data-d="5" aria-label="5秒増やす">+</button></div><span class="unit">秒</span></div>
        <div class="field"><label for="numGoal">流す時間</label><div class="stepper"><button type="button" class="step" data-for="numGoal" data-d="-1" aria-label="1秒減らす">−</button><input type="number" id="numGoal" inputmode="numeric" min="5" max="600" step="1" value="58"><button type="button" class="step" data-for="numGoal" data-d="1" aria-label="1秒増やす">+</button></div><span class="unit">秒</span></div>
        <label class="field" for="rngWin" id="winField">読む範囲<input type="range" id="rngWin" min="3" max="5" step="1" value="4"><output id="outWin">4字</output></label>
        <label class="field" for="rngSize">文字サイズ<input type="range" id="rngSize" min="22" max="72" step="2" value="40"><output id="outSize">40</output></label>
      </div>
      <div class="note" id="pace"></div>
      <div class="keys"><kbd>Space</kbd> 録画　<kbd>P</kbd> 練習　<kbd>↑</kbd><kbd>↓</kbd> 位置合わせ</div>
    </div>
  </div>

  <details id="editBox">
    <summary>原稿</summary>
    <div class="edit">
      <textarea id="script" aria-label="原稿" placeholder="原稿を貼り付け"></textarea>
      <div class="editfoot"><span class="meta" id="chars"></span><button class="plain" id="btnDefault">消去</button></div>
    </div>
  </details>

  <section class="takes">
    <h2>テイク</h2>
    <div id="takeList"><div class="empty">まだありません</div></div>
  </section>
  <footer class="foot">原稿と動画はこの端末の中だけに保存され、どこにも送信されません ・ <a href="https://github.com/rinta1015/pr-studio">GitHub</a></footer>
</div>

<script>
(() => {
const DEFAULT_SCRIPT = '';

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('prpr_'+k); return v===null?d:v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('prpr_'+k, v); }catch(e){} }
};

const track=$('track'), prompter=$('prompter'), script=$('script');
const numGoal=$('numGoal'), numLimit=$('numLimit'), rngSize=$('rngSize');
const clampSec = v => { v = Math.round(Number(v)); return Number.isFinite(v) && v>0 ? Math.min(600, Math.max(5, v)) : null; };
let goal = clampSec(store.get('goal', 58)) || 58, limit = clampSec(store.get('limit', 60)) || 60, size = +store.get('size', 40);
let vert = store.get('vert','0')==='1';
let win = +store.get('win', 4);
let orient = store.get('orient','h');
let camPos = ['top','left','right'].includes(store.get('cam','top')) ? store.get('cam','top') : 'top';
$('rngWin').value = win;
numGoal.value = goal; numLimit.value = limit; rngSize.value = size;
script.value = store.get('script', DEFAULT_SCRIPT);

// ---------- prompter ----------
let pos = 0;            // 0..1 progress through the script
let elapsed = 0;        // seconds of current run
let mode = 'idle';      // idle | countdown | practice | paused | rec
let last = 0, raf = 0;
const guideFrac = () => camPos==='top' ? 0.28 : 0.42;

function fmt(s){ const m=Math.floor(s/60), r=s-m*60; return m+':'+(r<10?'0':'')+r.toFixed(1); }
function fmtGoal(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

function renderScript(){
  track.innerHTML='';
  const html = t => t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/(^|[^0-9０-９])([0-9]{1,2})(?![0-9])/g,'$1<span class="tcy">$2</span>');
  const paras = script.value.split(/\n\s*\n|\n/).map(t=>t.trim()).filter(Boolean);
  if(vert && paras.length){
    // one continuous column: the eye stays in the window, the text moves
    const p=document.createElement('p'); p.innerHTML = paras.map(html).join('<span class="brk" aria-hidden="true">・</span>'); track.appendChild(p);
  } else {
    paras.forEach(t=>{ const p=document.createElement('p'); p.innerHTML=html(t); track.appendChild(p); });
  }
  if(!track.firstChild){ const p=document.createElement('p'); p.className='ph'; p.textContent='原稿が入っていません'; track.appendChild(p); $('editBox').open=true; }
  const n = script.value.replace(/\s/g,'').length;
  $('chars').textContent = n+'字';
  updatePace(); layout();
}
function updatePace(){
  const n = script.value.replace(/\s/g,'').length;
  const perMin = Math.round(n/goal*60);
  let msg = n ? `約${perMin}字/分` + (perMin>330 ? '・速め' : perMin<260 ? '・ゆっくり' : '') : '';
  if(goal > limit) msg += (msg?'　':'') + '流す時間が制限時間を超えています';
  $('pace').textContent = msg;
  $('pace').classList.toggle('fast', perMin>330 || goal>limit);
  $('tLimit').textContent = fmtGoal(limit);
}
function layout(){
  prompter.style.setProperty('--fs', size+'px');
  $('winField').hidden = !vert; $('outWin').textContent = win+'字';
  $('outSize').textContent = size;
  prompter.classList.toggle('v', vert);
  $('btnH').setAttribute('aria-pressed', String(!vert)); $('btnV').setAttribute('aria-pressed', String(vert));
  prompter.dataset.cam = camPos;
  document.querySelectorAll('.camsel').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.cam===camPos)));
  if(vert){
    const h = prompter.clientHeight;
    const wy = camPos==='top' ? Math.max(14, Math.round(h*0.05)) : Math.round(h*0.28);
    const wh = Math.round(win * size * 1.08 + size*0.3);
    track.style.padding = '0';
    prompter.style.setProperty('--wy', wy+'px'); prompter.style.setProperty('--wh', wh+'px');
    track.style.top = (wy + size*0.15)+'px';
  } else {
    const h = prompter.clientHeight;
    track.style.padding = ''; track.style.top = '';
    prompter.style.setProperty('--gy', (guideFrac()*100)+'%');
    track.style.paddingTop = (h*guideFrac() - size*0.9)+'px';
    track.style.paddingBottom = h+'px';
  }
  apply();
}
function contentH(){
  const cs = getComputedStyle(track);
  if(vert){ const p=track.firstElementChild; return p ? p.offsetHeight : 0; }
  return track.scrollHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
}
function apply(){
  // last line ends on the guide line at pos=1
  const lastP = track.lastElementChild;
  if(vert){
    const wh = parseFloat(getComputedStyle(prompter).getPropertyValue('--wh')) || 0;
    const dist = Math.max(0, contentH() - wh + size*0.3);
    track.style.transform = `translate(-50%, ${-pos*dist}px)`;
    return;
  }
  const lastH = lastP ? lastP.offsetHeight : 0;
  const dist = Math.max(0, contentH() - lastH);
  track.style.transform = `translateY(${-pos*dist}px)`;
}
function tick(now){
  const dt = Math.min(0.1,(now-last)/1000); last = now;
  if(mode==='practice'||mode==='rec'){
    elapsed += dt;
    pos = Math.min(1, pos + dt/goal);
    apply(); updateTimer();
  }
  raf = requestAnimationFrame(tick);
}
function updateTimer(){
  $('tNow').textContent = fmt(elapsed);
  $('badgeT').textContent = fmtGoal(Math.floor(elapsed));
  const t=$('timer'); t.classList.toggle('warn', elapsed>=limit-5 && elapsed<limit); t.classList.toggle('over', elapsed>=limit);
  $('barFill').style.width = Math.min(100, elapsed/limit*100)+'%';
}
function resetRun(){ pos=0; elapsed=0; apply(); updateTimer(); }

function countdown(){
  return new Promise(res=>{
    const c=$('count'); let n=3; c.textContent=n; c.hidden=false; mode='countdown'; syncButtons();
    const iv=setInterval(()=>{ n--; if(n<=0){ clearInterval(iv); c.hidden=true; res(); } else c.textContent=n; },800);
  });
}

// ---------- camera & recording ----------
let stream=null, recorder=null, chunks=[], takeNo=0, recMime='';
function pickMime(){
  if(!window.MediaRecorder) return '';
  const list=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  return list.find(t=>{ try{ return MediaRecorder.isTypeSupported(t); }catch(e){ return false; } }) || '';
}
async function startCamera(){
  const off=$('camOff');
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('nomedia');
    stream = await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1920},height:{ideal:1080},facingMode:'user'},audio:{echoCancellation:true,noiseSuppression:true}});
    $('preview').srcObject = stream; off.hidden = true;
    recMime = pickMime();
    $('btnRec').disabled = !window.MediaRecorder;
    if(!window.MediaRecorder){ off.hidden=false; off.textContent='このブラウザでは録画できません'; }
  }catch(e){
    off.hidden=false;
    off.textContent = 'カメラを使えません（練習はできます）';
  }
}
async function startRec(){
  if(!stream||mode!=='idle') return;
  resetRun();
  await countdown();
  chunks=[];
  const rs = buildRecStream();
  const opts = {videoBitsPerSecond:6000000}; if(recMime) opts.mimeType = recMime;
  try{ recorder = new MediaRecorder(rs, opts); }
  catch(e){ recorder = new MediaRecorder(rs); }
  recorder._orient = orient;
  recorder.ondataavailable = e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  const dur = {v:0};
  const r = recorder;
  recorder.onstop = ()=>{ stopDraw(); addTake(new Blob(chunks,{type:r.mimeType||recMime||'video/webm'}), dur.v, r._orient); };
  recorder._dur = dur;
  recorder.start(250);
  mode='rec'; $('recBadge').hidden=false; syncButtons();
}
function stopRec(){
  if(mode!=='rec') return;
  recorder._dur.v = elapsed;
  recorder.stop(); mode='idle'; $('recBadge').hidden=true; syncButtons();
}
// Crop the camera to the chosen frame on a canvas and record that, so 16:9 / 9:16 come out the same on PC, iPad and phone.
let canvas=null, drawId=0, canvasTrack=null;
function buildRecStream(){
  const v=$('preview'); const vw=v.videoWidth||1280, vh=v.videoHeight||720;
  const ta = orient==='v' ? 9/16 : 16/9;
  let sw=vw, sh=vh; if(vw/vh > ta) sw = vh*ta; else sh = vw/ta;
  const scale = Math.min(1, 1920/Math.max(sw,sh));
  canvas = document.createElement('canvas');
  canvas.width = Math.round(sw*scale/2)*2; canvas.height = Math.round(sh*scale/2)*2;
  const ctx = canvas.getContext('2d');
  const sx=(vw-sw)/2, sy=(vh-sh)/2;
  const draw=()=>{ ctx.drawImage(v,sx,sy,sw,sh,0,0,canvas.width,canvas.height); drawId=requestAnimationFrame(draw); };
  draw();
  const cs = canvas.captureStream(30);
  canvasTrack = cs.getVideoTracks()[0];
  stream.getAudioTracks().forEach(t=>cs.addTrack(t));
  return cs;
}
function stopDraw(){ cancelAnimationFrame(drawId); if(canvasTrack) canvasTrack.stop(); canvasTrack=null; }
function addTake(blob, secs, o){
  takeNo++;
  const list=$('takeList'); const empty=list.querySelector('.empty'); if(empty) empty.remove();
  const type = blob.type||'';
  const ext = type.includes('mp4') ? 'mp4' : 'webm';
  const url = URL.createObjectURL(blob);
  const el=document.createElement('div'); el.className='take';
  const v=document.createElement('video'); v.src=url; v.controls=true; v.playsInline=true;
  const info=document.createElement('div'); info.className='info';
  const name=document.createElement('div'); name.className='name'; name.textContent='テイク'+takeNo+(o==='v'?'・縦':'・横');
  const d=document.createElement('div'); d.className='dur';
  d.textContent = fmt(secs)+(secs>limit?'　'+fmtGoal(limit)+'超過':''); if(secs>limit) d.classList.add('over');
  const a=document.createElement('a'); a.className='save'; a.href=url; a.download=`自己PR_テイク${takeNo}.${ext}`; a.textContent='保存';
  const note=document.createElement('div'); note.className='note';
  note.textContent = ext==='webm' ? 'WebM形式' : '';
  info.append(name,d,a,note); el.append(v,info);
  list.prepend(el);
}

// ---------- practice ----------
async function togglePractice(){
  if(mode==='practice'){ mode='paused'; }
  else if(mode==='paused'){ mode='practice'; }
  else if(mode==='idle'){ if(pos>=1) resetRun(); await countdown(); mode='practice'; }
  syncButtons();
}
function syncButtons(){
  const r=$('btnRec'), p=$('btnPractice');
  r.classList.toggle('stop', mode==='rec');
  r.textContent = mode==='rec' ? '停止' : '録画';
  r.disabled = !stream || !window.MediaRecorder || mode==='countdown' || mode==='practice' || mode==='paused';
  p.textContent = mode==='practice' ? '一時停止' : mode==='paused' ? '再開' : '練習';
  p.disabled = mode==='rec' || mode==='countdown';
  $('btnReset').disabled = mode==='rec' || mode==='countdown';
  $('btnH').disabled = $('btnV').disabled = $('btnOH').disabled = $('btnOV').disabled = mode==='rec' || mode==='countdown';
  document.querySelectorAll('.camsel').forEach(b=>{ b.disabled = mode==='rec' || mode==='countdown'; });
  [numGoal, numLimit, ...document.querySelectorAll('.step')].forEach(el=>{ el.disabled = mode==='rec' || mode==='countdown'; });
}

// ---------- wiring ----------
$('btnRec').onclick = ()=> mode==='rec' ? stopRec() : startRec();
$('btnPractice').onclick = togglePractice;
$('btnReset').onclick = ()=>{ if(mode==='paused') mode='idle'; resetRun(); syncButtons(); };
function setVert(v){ if(mode==='rec'||mode==='countdown') return; vert=v; store.set('vert', v?'1':'0'); renderScript(); }
function setOrient(o){ if(mode==='rec'||mode==='countdown') return; orient=o; store.set('orient',o); applyOrient(); }
function applyOrient(){ $('cam').classList.toggle('port', orient==='v'); $('btnOH').setAttribute('aria-pressed', String(orient!=='v')); $('btnOV').setAttribute('aria-pressed', String(orient==='v')); }
$('btnOH').onclick = ()=>setOrient('h');
$('btnOV').onclick = ()=>setOrient('v');
document.querySelectorAll('.camsel').forEach(b=>b.addEventListener('click', ()=>{ if(mode==='rec'||mode==='countdown') return; camPos=b.dataset.cam; store.set('cam',camPos); layout(); }));
prompter.addEventListener('click', ()=>{ if(mode==='idle'||mode==='practice'||mode==='paused') togglePractice(); });
$('rngWin').oninput = ()=>{ win=+$('rngWin').value; store.set('win',win); layout(); };
$('btnH').onclick = ()=>setVert(false);
$('btnV').onclick = ()=>setVert(true);
function setSec(which, v, normalize){
  const c = clampSec(v);
  if(c===null){ if(normalize){ (which==='goal'?numGoal:numLimit).value = which==='goal'?goal:limit; } return; }
  if(which==='goal'){ goal=c; store.set('goal',c); if(normalize) numGoal.value=c; }
  else { limit=c; store.set('limit',c); if(normalize) numLimit.value=c; }
  updatePace(); updateTimer();
}
numGoal.addEventListener('input', ()=>setSec('goal', numGoal.value, false));
numLimit.addEventListener('input', ()=>setSec('limit', numLimit.value, false));
numGoal.addEventListener('change', ()=>setSec('goal', numGoal.value, true));
numLimit.addEventListener('change', ()=>setSec('limit', numLimit.value, true));
document.querySelectorAll('.step').forEach(b=>b.addEventListener('click', ()=>{
  const which = b.dataset.for==='numGoal' ? 'goal' : 'limit';
  setSec(which, (which==='goal'?goal:limit) + Number(b.dataset.d), true);
}));
rngSize.oninput = ()=>{ size=+rngSize.value; store.set('size',size); layout(); };
script.oninput = ()=>{ store.set('script',script.value); renderScript(); };
$('btnDefault').onclick = ()=>{ script.value=DEFAULT_SCRIPT; store.set('script',DEFAULT_SCRIPT); renderScript(); };
window.addEventListener('resize', layout);
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT') return;
  if(e.code==='Space'){ e.preventDefault(); if(mode==='rec') stopRec(); else if(mode==='idle' && stream) startRec(); }
  else if(e.key==='p'||e.key==='P'){ togglePractice(); }
  else if(['ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key)){ e.preventDefault(); const fwd = e.key==='ArrowDown' || e.key==='ArrowRight'; pos=Math.min(1,Math.max(0,pos+(fwd?0.02:-0.02))); apply(); }
});

applyOrient(); renderScript(); updateTimer(); syncButtons();
document.fonts && document.fonts.ready.then(layout);
last = performance.now(); raf = requestAnimationFrame(tick);
startCamera();
})();
</script>
